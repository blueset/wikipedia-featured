name: Fetch Featured and Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Restore Wikimedia response cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/wikimedia
          key: wikimedia-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wikimedia-etag-v1-

      - name: Build JSON
        run: |
          npm run build
          curl https://api.1point3acres.com/visa_tracker/greencard/visa_bulletin > ./dist/visa_bulletin.json

      - name: Save Wikimedia response cache
        uses: actions/cache/save@v4
        with:
          path: .cache/wikimedia
          key: wikimedia-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Include fonts in site
        run: |
          mkdir -p ./dist/fonts
          cp -r ./fonts/* ./dist/fonts/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
